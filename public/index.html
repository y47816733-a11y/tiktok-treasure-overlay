<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TikTok Treasure</title>

  <style>
    body {
      margin: 0;
      background: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      width: 90%;
      max-width: 420px;
      margin: 30px auto;
    }

    input {
      width: 90%;
      padding: 14px;
      font-size: 18px;
      border-radius: 10px;
      border: 2px solid #222;
      box-sizing: border-box;
    }

    button {
      margin-top: 10px;
      padding: 12px 25px;
      font-size: 17px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: white;
    }

    #user {
      font-size: 22px;
      font-weight: bold;
      margin-top: 20px;
    }

    #info {
      font-size: 20px;
      margin-top: 8px;
    }

    #score {
      font-size: 110px;
      font-weight: bold;
      margin-top: 30px;
    }

    #timer {
      font-size: 42px;
      font-weight: bold;
      margin-top: 10px;
    }

    #status {
      margin-top: 20px;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="box">

    <input
      id="username"
      placeholder="TikTok kullanıcı adı"
    >

    <br>

    <button onclick="connectTikTok()">
      BAĞLAN
    </button>

    <div id="user">
      TikTok LIVE
    </div>

    <div id="info">
      🎁 0 / 0 👀
    </div>

    <div id="score">
      00.0
    </div>

    <div id="timer">
      00:00:00
    </div>

    <div id="status">
      Bağlantı bekleniyor...
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>

  <script>

    const socket = io();

    function connectTikTok() {

      const username =
        document.getElementById("username").value;

      if (!username) {
        alert("TikTok kullanıcı adını yaz");
        return;
      }

      document.getElementById("user").innerText =
        "@" + username;

      socket.emit("connectTikTok", username);
    }

    socket.on("status", (message) => {
      document.getElementById("status").innerText =
        message;
    });

    socket.on("treasure", (data) => {

      document.getElementById("info").innerText =
        "🎁 " + data.diamonds +
        " / " + data.people +
        " 👀";

      document.getElementById("score").innerText =
        "00.0";
    });

    socket.on("timer", (seconds) => {

      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;

      document.getElementById("timer").innerText =
        String(h).padStart(2, "0") + ":" +
        String(m).padStart(2, "0") + ":" +
        String(s).padStart(2, "0");
    });

  </script>

</body>
      </html>
